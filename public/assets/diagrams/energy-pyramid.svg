<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" font-family="Georgia, serif" font-size="13">
  <title>Pyramid of energy with four trophic levels</title>
  <polygon points="40,210 320,210 290,160 70,160" fill="#e8efe3" stroke="#222"/>
  <polygon points="70,160 290,160 255,110 105,110" fill="#f3f1e2" stroke="#222"/>
  <polygon points="105,110 255,110 220,60 140,60" fill="#f3e8e2" stroke="#222"/>
  <polygon points="140,60 220,60 180,10" fill="#ece6f3" stroke="#222"/>
  <text x="120" y="190">Producers (T₁): 10,000 J</text>
  <text x="122" y="140">Primary consumers (T₂)</text>
  <text x="128" y="90">Secondary (T₃)</text>
  <text x="166" y="50">T₄</text>
</svg>
