<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 380 214" width="380" height="220" font-family="Georgia, serif" font-size="14" stroke="#222" stroke-width="2" fill="none">
  <title>Circuit: 6 ohm and 3 ohm in parallel, in series with 4 ohm, across a 12 V battery</title>
  <!-- battery on left -->
  <line x1="40" y1="30" x2="40" y2="95"/>
  <line x1="25" y1="95" x2="55" y2="95"/>
  <line x1="32" y1="105" x2="48" y2="105" stroke-width="4"/>
  <line x1="40" y1="105" x2="40" y2="190"/>
  <text x="58" y="105" stroke="none" fill="#222">12 V</text>
  <!-- top wire to parallel block -->
  <line x1="40" y1="30" x2="150" y2="30"/>
  <line x1="150" y1="30" x2="150" y2="10"/><line x1="150" y1="30" x2="150" y2="60"/>
  <rect x="180" y="2" width="60" height="16" fill="#fff"/>
  <line x1="150" y1="10" x2="180" y2="10"/><line x1="240" y1="10" x2="270" y2="10"/>
  <text x="199" y="15" stroke="none" fill="#222" font-size="12">6 Ω</text>
  <rect x="180" y="52" width="60" height="16" fill="#fff"/>
  <line x1="150" y1="60" x2="180" y2="60"/><line x1="240" y1="60" x2="270" y2="60"/>
  <text x="199" y="65" stroke="none" fill="#222" font-size="12">3 Ω</text>
  <line x1="270" y1="10" x2="270" y2="60"/>
  <line x1="270" y1="30" x2="340" y2="30"/>
  <line x1="340" y1="30" x2="340" y2="190"/>
  <!-- 4 ohm at bottom -->
  <line x1="340" y1="190" x2="220" y2="190"/>
  <rect x="160" y="182" width="60" height="16" fill="#fff"/>
  <text x="179" y="195" stroke="none" fill="#222" font-size="12">4 Ω</text>
  <line x1="160" y1="190" x2="40" y2="190"/>
</svg>
