services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prepledger
      POSTGRES_PASSWORD: prepledger
      POSTGRES_DB: prepledger
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prepledger"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://prepledger:prepledger@db:5432/prepledger
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (32+ chars)}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:4000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    volumes: [uploads:/app/public/assets/diagrams/uploads]
volumes:
  pgdata:
  uploads:
